name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bunx --bun prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: bun run typecheck
      - run: bun test
      - run: bun run version:check
      - name: OpenAPI document is up to date
        run: |
          bun run openapi:export
          git diff --exit-code -- docs/openapi.json || (echo '::error::docs/openapi.json is stale — run `bun run openapi:export` and commit' && exit 1)
