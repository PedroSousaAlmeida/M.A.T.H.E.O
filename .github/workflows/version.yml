name: Version

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # On PRs to main: the version must be valid semver, greater than main's, not yet tagged,
  # and the Postman collection must carry the same version.
  check-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Collection version matches package.json
        run: bun run scripts/version-check.ts
      - name: Version was bumped and is untagged
        run: |
          set -euo pipefail
          NEW=$(jq -r .version package.json)
          if git cat-file -e "origin/${{ github.base_ref }}:package.json" 2>/dev/null; then
            BASE=$(git show "origin/${{ github.base_ref }}:package.json" | jq -r .version)
          else
            BASE=0.0.0   # base branch has no package.json yet (first release)
          fi
          echo "main=$BASE  pr=$NEW"
          if [ "$NEW" = "$BASE" ]; then
            echo "::error::package.json version ($NEW) was not bumped relative to main ($BASE)"; exit 1
          fi
          # highest of the two must be the new one (sort -V handles semver ordering)
          if [ "$(printf '%s\n%s\n' "$BASE" "$NEW" | sort -V | tail -n1)" != "$NEW" ]; then
            echo "::error::package.json version ($NEW) is lower than main ($BASE)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "::error::tag v$NEW already exists; bump the version"; exit 1
          fi

  # On push to main: make sure tag + GitHub release exist for package.json's version.
  # Creates them when missing; fails if an existing tag points to a commit with a different version.
  tag-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/version-check.ts
      - name: Ensure tag and release match package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAGGED_VERSION=$(git show "$TAG:package.json" | jq -r .version)
            if [ "$TAGGED_VERSION" != "$VERSION" ]; then
              echo "::error::tag $TAG points to package.json version $TAGGED_VERSION"; exit 1
            fi
            echo "tag $TAG already exists and matches"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "created tag $TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --prerelease
            echo "created release $TAG (pre-release while major is 0)"
          fi
